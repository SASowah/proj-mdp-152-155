---
- name: Create Kubernetes cluster
  hosts: k8s_workstation
  become: yes
  vars:
    cluster_name: "mycluster.k8s.local"
    state_store: "k8s-kops-everything-state-chsufg1"
    zones: "us-east-1a,us-east-1b"
    node_count: 2
    node_size: "t2.medium"
    master_size: "t2.medium"

  tasks:
    - name: Debug — Check if kops exists
      shell: which kops
      register: kops_check

    - debug:
        var: kops_check.stdout

    - name: Create the cluster using Kops
      shell: |
        kops create cluster \
          --name {{ cluster_name }} \
          --state s3://{{ state_store }} \
          --zones {{ zones }} \
          --node-count {{ node_count }} \
          --node-size {{ node_size }} \
          --master-size {{ master_size }}
      register: kops_create_cluster
      args:
        executable: /bin/bash
      failed_when: "'already exists' not in kops_create_cluster.stderr and kops_create_cluster.rc != 0"
      changed_when: "'already exists' not in kops_create_cluster.stderr"

    - name: Update and apply the cluster configuration
      shell: |
        kops update cluster \
          --name {{ cluster_name }} \
          --state s3://{{ state_store }} \
          --yes
      args:
        executable: /bin/bash

    - name: Wait for cluster resources to settle
      pause:
        minutes: 2

    - name: Validate the Kubernetes cluster
      shell: |
        kops validate cluster \
          --name {{ cluster_name }} \
          --state s3://{{ state_store }}
      register: kops_validate_cluster
      retries: 5
      delay: 60
      until: kops_validate_cluster.rc == 0
      args:
        executable: /bin/bash

    - name: Show validation output
      debug:
        var: kops_validate_cluster.stdout_lines
