---
- name: Create kubernetes cluster
  hosts: k8s_workstation
  become: yes
  vars:
    cluster_name: "mycluster.k8s.local"
    state_store: "k8s-kops-everything-state-chsufg1"
    zones: "us-east-1a,us-east-1b"
    node_count: 2
    node_size: "t2.medium"
    master_size: "t2.medium"

  tasks:
    - name: Find kops binary location
      shell: which kops || find / -name kops -type f 2>/dev/null | head -1
      register: kops_path
      ignore_errors: yes
      changed_when: false

    - name: Display kops path
      debug:
        var: kops_path.stdout

    - name: Fail if kops is not found
      fail:
        msg: "kops binary not found. Please install kops first."
      when: kops_path.stdout == ""

    - name: Create a Kubernetes cluster using kops
      shell: "{{ kops_path.stdout }} create cluster --name {{ cluster_name }} --state s3://{{ state_store }} --zones {{ zones }} --node-count {{ node_count }} --node-size {{ node_size }} --master-size {{ master_size }} --yes"
      register: kops_create_cluster
      
    - name: Validate the cluster creation
      shell: "{{ kops_path.stdout }} validate cluster --name {{ cluster_name }} --state s3://{{ state_store }}"
      register: kops_validate_cluster
      retries: 5
      delay: 30
      until: kops_validate_cluster.rc == 0
      when: kops_create_cluster is defined and kops_create_cluster.rc == 0
      ignore_errors: yes

    - name: Output the result of the cluster creation
      debug:
        var: kops_create_cluster.stdout
      when: kops_create_cluster is defined and kops_create_cluster.stdout is defined
      
    - name: Output the result of the cluster validation
      debug:
        var: kops_validate_cluster.stdout
      when: kops_validate_cluster is defined and kops_validate_cluster.stdout is defined
...
