---
- name: Create kubernetes cluster
  hosts: k8s_workstation
  become: yes
  vars:
    cluster_name: "mycluster.k8s.local"
    state_store: "k8s-kops-everything-state-chsufg1"
    zones: "us-east-1a,us-east-1b"
    node_count: 2
    node_size: "t2.medium"
    master_size: "t2.medium"

  tasks:
    - name: Create a Kubernetes cluster using kops
      command: >
        /usr/local/bin/kops create cluster
        --name {{ cluster_name }}
        --state s3://{{ state_store }}
        --zones {{ zones }}
        --node-count {{ node_count }}
        --node-size {{ node_size }}
        --control_plane_size {{ master_size }}
      register: kops_create_cluster
      failed_when: "'already exists' not in kops_create_cluster.stderr and kops_create_cluster.rc != 0"
      changed_when: "'already exists' not in kops_create_cluster.stderr"    

    - name: Update and apply the Kubernetes cluster configuration
      command: >
        /usr/local/bin/kops update cluster
        --name {{ cluster_name }}
        --state s3://{{ state_store }}
        --yes
        
    - name: Validate the cluster creation
      command: >
        /usr/local/bin/kops validate cluster
        --name {{ cluster_name }}
        --state s3://{{ state_store }}
      register: kops_validate_cluster
      retries: 5
      delay: 60
      until: kops_validate_cluster.rc == 0
      
    - name: Output the result of the cluster creation
      debug:
        var: kops_validate_cluster.stdout
...
