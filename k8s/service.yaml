apiVersion: v1                 # Core API version for Services
kind: Service                  # You're defining a Service
metadata:
  name: webcalc-service        # Name of the service
spec:
  selector:
    app: webcalc               # This service routes to Pods with this label
  ports:
  - protocol: TCP
    port: 80                   # External port exposed by LoadBalancer
    targetPort: 8080           # Internal port on Pods (containerPort)
  type: LoadBalancer           # Exposes externally with a public IP via cloud provider
